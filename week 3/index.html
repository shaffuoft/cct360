<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Power of Sequencing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Power of Sequencing</h1>
    <h2>A Study Break</h2>
    <p>Three photos from a student's day.</p>
    <div class="scene">
      <h3>Beginning</h3>
      <div class="photo-space">Study notes photo goes here.</div>
    </div>
    <div class="scene">
      <h3>Middle</h3>
      <div class="photo-space">Game controller photo goes here.</div>
    </div>

    <div class="scene">
      <h3>End</h3>
      <div class="photo-space">Clock photo goes here.</div>
    </div>

    <p id="story">Click the button to read the first story.</p>
    <button id="storyButton">Read the story</button>

    <script src="script.js"></script>
  </body>
</html>
