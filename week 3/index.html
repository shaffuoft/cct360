<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Power of Sequencing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Power of Sequencing</h1>
    <h2>A Study Break</h2>
    <p>See how the same three photos can tell different stories.</p>

    <button id="story1">Story 1</button>
    <button id="story2">Story 2</button>

    <h3 id="part">Beginning</h3>

    <div class="photo-space" id="photo">
      <img src="studynote.jpeg" alt="Study notes" />
    </div>

    <button id="beginning">Beginning</button>
    <button id="middle">Middle</button>
    <button id="end">End</button>

    <p id="story">I sat down to study for my upcoming test.</p>

    <script src="script.js"></script>
  </body>
</html>
