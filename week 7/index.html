<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mississauga Sky Check</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="weather-box">
      <h1>Mississauga Sky Check</h1>

      <p>Current cloud cover:</p>
      <h2 id="cloud-cover">Loading...</h2>
      <div class="bar-box">
        <div id="cloud-bar"></div>
      </div>
      <p id="message">Checking the weather...</p>

      <button id="check-button">Check Again</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
