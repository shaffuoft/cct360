<!doctype html>
<html>
  <head>
    <title>Rainy Evening</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>A Rainy Evening in Mississauga</h1>
    <p>This project represents a rainy evening in the city.</p>
    <p>Listen to the sound of rain and watch the image change.</p>

    <h2>Rain Soundscape</h2>

    <audio id="sound">
      <source src="rain.mp3" type="audio/mpeg" />
    </audio>

    <button id="playBtn">Play</button>
    <button id="pauseBtn">Pause</button>
    <button id="stopBtn">Stop</button>

    <h2>Visualscape</h2>
    <img id="picture" src="rain.jpeg" width="500" />
    <p>Press Play to change the picture.</p>
    <script src="script.js"></script>
  </body>
</html>
